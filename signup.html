        <main class="signup-wrapper">

        <h2>Създай профил</h2>

        <form class="signup-form">
            <div class="form-group">
                <label for="name">Име и Фамилия</label>
                <input type="text" id="name" placeholder="Иван Иванов" required>
            </div>

            <div class="form-group">
                <label for="email">Имейл адрес</label>
                <input type="email" id="email" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label for="password">Парола</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-register">Регистрация</button>
        </form>

        <p class="form-footer">Вече имаш профил? <a href="#">Вход тук</a></p>
